name: Nifty 500 fundamentals
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset_group:
        type: choice
        options: [CORE, EXTENDED, MEMBERSHIP, MARKET]
        default: CORE
  schedule:
    - cron: '7 1,7,13,19 * * *'
    - cron: '37 3,9,15,21 * * *'
    - cron: '52 2 * * *'
    - cron: '17 0,4,8,12,16,20 * * *'
permissions:
  contents: read
concurrency:
  group: fundamental-pilot
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: if [ "$DATASET_GROUP" = MEMBERSHIP ]; then python membership.py && python intelligence.py; elif [ "$DATASET_GROUP" = MARKET ]; then python market.py --limit 100; else python fleet.py --limit 50 --minutes 40 --group "$DATASET_GROUP"; fi
        env:
          DATASET_GROUP: ${{ inputs.dataset_group || (github.event.schedule == '17 0,4,8,12,16,20 * * *' && 'MARKET') || (github.event.schedule == '52 2 * * *' && 'MEMBERSHIP') || (github.event.schedule == '37 3,9,15,21 * * *' && 'EXTENDED') || 'CORE' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundamental-fleet-evidence
          path: |
            reports/fleet/
            reports/membership/
            reports/intelligence/
            reports/market/
          retention-days: 14
