name: Yahoo five-company pilot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '30 13 * * 1-5'
permissions:
  contents: read
concurrency:
  group: fundamental-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Acquire and stage Yahoo data
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          YAHOO_IGNORE_STORAGE_BUDGET: "true"
        run: python yahoo_pilot.py --publish
      - name: Deep accessor and coverage diagnostic
        if: always()
        run: python yahoo_deep.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yahoo-pilot-evidence
          path: reports/yahoo/
          retention-days: 14
