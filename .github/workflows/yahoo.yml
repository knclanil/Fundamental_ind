name: Nifty 500 fundamentals
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset_group:
        type: choice
        options: [CORE, EXTENDED]
        default: CORE
  schedule:
    - cron: '7 * * * *'
    - cron: '37 * * * *'
permissions:
  contents: read
concurrency:
  group: fundamental-pilot
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_rebuild.py
      - run: python fleet.py --limit 500 --minutes 300 --group "$DATASET_GROUP"
        env:
          DATASET_GROUP: ${{ inputs.dataset_group || (github.event.schedule == '37 * * * *' && 'EXTENDED') || 'CORE' }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fundamental-fleet-evidence
          path: reports/fleet/
          retention-days: 14
