name: Fundamental ingestion
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '23 */4 * * *'
permissions:
  contents: read
concurrency:
  group: fundamental-production
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python pipeline.py init
      - run: python pipeline.py refresh
      - run: python pipeline.py work --limit 60
      - if: always()
        run: python pipeline.py report >> "$GITHUB_STEP_SUMMARY"
